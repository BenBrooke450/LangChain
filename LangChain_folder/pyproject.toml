[project]
name = "langchain-folder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BenBrooke450", email = "bensir@mail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncio>=4.0.0",
    "black>=26.5.1",
    "certifi>=2026.7.22",
    "deepagents>=0.7.8",
    "isort>=8.0.1",
    "langchain>=1.3.16",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-mistralai>=1.1.6",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langchain-unstructured>=1.0.1",
    "langgraph>=1.2.11",
    "mistralai>=2.9.4",
    "python-dotenv>=1.2.3",
    "unstructured>=0.27.5",
]

[project.scripts]
langchain-folder = "langchain_folder:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
